<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 857px;
    height: 633px;
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo {
    position: relative;
    width: 700px;
    height: 520px;
  }
  .word-top {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Bangers', cursive;
    font-size: 200px;
    color: #2c3e6b;
    letter-spacing: 4px;
    line-height: 1;
    -webkit-text-stroke: 3px #1a2544;
    text-shadow: 5px 5px 0 rgba(26,37,68,0.4);
    z-index: 2;
  }
  .word-bottom {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-42%);
    font-family: 'Bangers', cursive;
    font-size: 200px;
    color: #c9a94e;
    letter-spacing: 10px;
    line-height: 1;
    -webkit-text-stroke: 3px #8a6d2a;
    text-shadow: 5px 5px 0 rgba(138,109,42,0.4);
    z-index: 2;
  }
  /* Blue circle behind skull */
  .skull-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(58,90,159,0.35) 0%, rgba(58,90,159,0.15) 70%, transparent 100%);
    z-index: 3;
  }
  .skull-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    z-index: 4;
  }
  /* Rope */
  .rope {
    position: absolute;
    top: 50%;
    left: 30px;
    right: 30px;
    height: 14px;
    transform: translateY(-50%);
    z-index: 3;
    background: linear-gradient(180deg, #d4b87a 0%, #a08245 40%, #c4a265 60%, #d4b87a 100%);
    border-radius: 7px;
    border-top: 1px solid #e0cfa0;
    border-bottom: 2px solid #7a5d30;
  }
  .rope::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      115deg,
      transparent 0px,
      rgba(0,0,0,0.08) 2px,
      transparent 4px,
      transparent 8px
    );
    border-radius: 7px;
  }
  .rope::after {
    content: '';
    position: absolute;
    right: 15px;
    top: -5px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #d4b87a, #a08245);
    border: 2px solid #7a5d30;
  }
  /* Compass */
  .compass {
    position: absolute;
    bottom: 55px;
    right: 68px;
    z-index: 5;
  }
  .compass svg { display: block; }
  /* Figure silhouette */
  .figure {
    position: absolute;
    bottom: 100px;
    left: 195px;
    z-index: 5;
    opacity: 0.5;
  }
</style>
</head>
<body>
<div class="logo">
  <div class="word-top">VOID</div>
  <div class="rope"></div>
  <div class="skull-bg"></div>

  <!-- Skull & crossbones SVG -->
  <svg class="skull-svg" width="210" height="210" viewBox="0 0 210 210">
    <!-- Crossbones -->
    <g stroke="#e8dcc8" stroke-width="16" stroke-linecap="round" fill="none">
      <line x1="20" y1="30" x2="190" y2="180"/>
      <line x1="190" y1="30" x2="20" y2="180"/>
    </g>
    <g fill="#e8dcc8" stroke="#bbb" stroke-width="2">
      <circle cx="20" cy="30" r="12"/><circle cx="190" cy="30" r="12"/>
      <circle cx="20" cy="180" r="12"/><circle cx="190" cy="180" r="12"/>
      <circle cx="14" cy="24" r="8"/><circle cx="26" cy="24" r="8"/>
      <circle cx="184" cy="24" r="8"/><circle cx="196" cy="24" r="8"/>
      <circle cx="14" cy="186" r="8"/><circle cx="26" cy="186" r="8"/>
      <circle cx="184" cy="186" r="8"/><circle cx="196" cy="186" r="8"/>
    </g>
    <!-- Skull head -->
    <ellipse cx="105" cy="82" rx="55" ry="62" fill="#f0e8d8" stroke="#333" stroke-width="3"/>
    <!-- Jaw -->
    <path d="M60,105 Q55,145 75,152 L80,146 90,152 100,146 110,152 120,146 130,152 Q155,145 150,105" fill="#f0e8d8" stroke="#333" stroke-width="3"/>
    <!-- Eyes -->
    <ellipse cx="82" cy="72" rx="18" ry="20" fill="#111"/>
    <ellipse cx="128" cy="72" rx="18" ry="20" fill="#111"/>
    <!-- Cyan glow eyes -->
    <ellipse cx="82" cy="72" rx="10" ry="11" fill="#00e5ff" opacity="0.8"/>
    <ellipse cx="128" cy="72" rx="10" ry="11" fill="#00e5ff" opacity="0.8"/>
    <ellipse cx="82" cy="70" rx="5" ry="5" fill="#fff" opacity="0.9"/>
    <ellipse cx="128" cy="70" r="5" fill="#fff" opacity="0.9"/>
    <!-- Circuit lines on forehead -->
    <path d="M95,38 L95,50 L105,56 L115,50 L115,38" fill="none" stroke="#00e5ff" stroke-width="2.5" opacity="0.7"/>
    <circle cx="105" cy="56" r="3" fill="#00e5ff" opacity="0.7"/>
    <line x1="85" y1="44" x2="75" y2="44" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="125" y1="44" x2="135" y2="44" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
    <!-- Nose -->
    <path d="M100,95 L105,104 L110,95" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Teeth -->
    <line x1="75" y1="130" x2="135" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="88" y1="122" x2="88" y2="138" stroke="#333" stroke-width="1.5"/>
    <line x1="100" y1="122" x2="100" y2="138" stroke="#333" stroke-width="1.5"/>
    <line x1="112" y1="122" x2="112" y2="138" stroke="#333" stroke-width="1.5"/>
    <line x1="124" y1="122" x2="124" y2="138" stroke="#333" stroke-width="1.5"/>
  </svg>

  <div class="word-bottom">DEV</div>

  <!-- Compass SVG -->
  <div class="compass">
    <svg width="90" height="90" viewBox="0 0 90 90">
      <circle cx="45" cy="45" r="43" fill="#111" stroke="#8a6d2a" stroke-width="4"/>
      <circle cx="45" cy="45" r="36" fill="none" stroke="#444" stroke-width="1.5"/>
      <!-- Dial marks -->
      <line x1="45" y1="12" x2="45" y2="18" stroke="#888" stroke-width="2"/>
      <line x1="45" y1="72" x2="45" y2="78" stroke="#888" stroke-width="2"/>
      <line x1="12" y1="45" x2="18" y2="45" stroke="#888" stroke-width="2"/>
      <line x1="72" y1="45" x2="78" y2="45" stroke="#888" stroke-width="2"/>
      <!-- N/S/E/W -->
      <text x="45" y="28" text-anchor="middle" font-family="Bangers" font-size="10" fill="#999">N</text>
      <text x="45" y="70" text-anchor="middle" font-family="Bangers" font-size="10" fill="#999">S</text>
      <text x="68" y="49" text-anchor="middle" font-family="Bangers" font-size="10" fill="#999">E</text>
      <text x="23" y="49" text-anchor="middle" font-family="Bangers" font-size="10" fill="#999">W</text>
      <!-- Needle -->
      <polygon points="45,14 41,45 49,45" fill="#cc3333"/>
      <polygon points="45,76 41,45 49,45" fill="#ddd"/>
      <circle cx="45" cy="45" r="5" fill="#fff"/>
      <circle cx="45" cy="45" r="2.5" fill="#333"/>
    </svg>
  </div>

  <!-- Small figure -->
  <div class="figure">
    <svg width="30" height="48" viewBox="0 0 30 48">
      <circle cx="15" cy="7" r="6" fill="#c9a94e" stroke="#8a6d2a" stroke-width="1"/>
      <path d="M8,13 Q6,20 8,30 L12,30 L12,24 L18,24 L18,30 L22,30 Q24,20 22,13 Z" fill="#c9a94e" stroke="#8a6d2a" stroke-width="1"/>
      <rect x="8" y="30" width="6" height="14" rx="2" fill="#c9a94e" stroke="#8a6d2a" stroke-width="1"/>
      <rect x="16" y="30" width="6" height="14" rx="2" fill="#c9a94e" stroke="#8a6d2a" stroke-width="1"/>
    </svg>
  </div>
</div>
</body>
</html>
